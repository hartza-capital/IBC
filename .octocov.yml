coverage:
  # Ratchet, not a target: measured line coverage is ~20% because the Swing
  # handlers have no tests yet. Raise this with every batch of tests; never
  # lower it to make a build pass.
  acceptable: 20%
  paths:
    - target/site/jacoco/jacoco.xml

diff_coverage:
  enabled: true

comment:
  updatePrevious: true

report:
  datastores:
    - artifact://${GITHUB_REPOSITORY}

diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}

push:
  if: is_default_branch
