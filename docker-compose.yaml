# Release checks for IBC, built from the working tree.
#
#   docker compose run --rm verify        structural check of IBCLinux-<ver>.zip
#   docker compose run --rm --build smoke end-to-end: IBC drives a real Gateway
#   docker compose run --rm dist          copy the built ZIP into ./dist
name: ibc-release-check

services:
  # Builds with the JDK and Maven the pom requires, then asserts on the archive:
  # contents, executable bits, stamped version, and a jar free of IDE stubs.
  verify:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: verify

  # Opt-in: the runtime image is linux/amd64 only, so this pulls ~1.3 GB and
  # runs emulated on Apple Silicon.
  smoke:
    profiles: ["smoke"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gateway-smoke

  # Handy when the artifact is wanted on the host without a local JDK 25.
  dist:
    profiles: ["dist"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build
    volumes:
      - ./dist:/out
    command: ["sh", "-c", "cp -v /workspace/dist/IBCLinux-*.zip /out/"]
